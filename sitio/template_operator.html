<!doctype html>
<html lang="{{LANG}}" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DOC_TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="alternate" hreflang="en" href="{{HREF_EN}}">
<link rel="alternate" hreflang="es" href="{{HREF_ES}}">
<link rel="alternate" hreflang="x-default" href="{{HREF_EN}}">
{{HEAD_EXTRA}}
<style>
{{STYLE}}
</style>
</head>
<body>

<!-- Ficha por operador. Todo el contenido indexable sale ya escrito en el HTML:
     no hay nada que dependa de JavaScript para leerse. Los datos los pone
     build_site.py leyendo /operators.json; esta plantilla no contiene ni una
     medida. -->

<div class="shell">

  <header>
    <div class="topbar">
{{BRAND}}
      <div class="topbar__tools">
        <button type="button" class="themetoggle" id="theme-toggle" aria-pressed="false" data-to-dark="{{theme_to_dark}}" data-to-light="{{theme_to_light}}" aria-label="{{theme_to_dark}}" title="{{theme_to_dark}}">
          <svg class="themetoggle__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="themetoggle__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
        </button>
        <nav class="langnav" aria-label="{{nav_label}}">
        <a href="{{NAV_EN_PATH}}" lang="en" hreflang="en"{{NAV_EN_CUR}}>English</a>
        <a href="{{NAV_ES_PATH}}" lang="es" hreflang="es"{{NAV_ES_CUR}}>Español</a>
      </nav>
      </div>
    </div>
    <nav class="crumbs" aria-label="{{crumbs_label}}">
{{CRUMBS}}
    </nav>
    <h1>{{H1}}</h1>
    <p class="standfirst">{{STANDFIRST}}</p>
  </header>

  <!-- La procedencia va arriba de todo a propósito: la fuente oficial y la
       fecha humana son el diferenciador del sitio, no una nota al pie. -->
  <section class="provenance">
{{PROVENANCE}}
  </section>

{{ALLOWANCES}}

{{RULE}}

{{WHEELS}}

  <section class="prose">
    <h2>{{fiche_caveats_h}}</h2>
{{CAVEATS}}
  </section>

  <section>
    <a class="cta" href="{{CHECKER_HREF}}">{{fiche_cta}}</a>
  </section>

  <footer>
    <p>{{footer_scope}}</p>
    <p>{{FICHE_STAMP}}</p>
{{FOOTER_LINKS}}
  </footer>
</div>

<script>
/* Modo claro por defecto, modo noche con el botón. A propósito NO se guarda
   la elección: /cookies/ promete que el sitio no escribe nada en el navegador.
   Por eso cada página arranca en claro. */
(function () {
  var root = document.documentElement, b = document.getElementById("theme-toggle");
  if (!b) return;
  function paint() {
    var dark = root.getAttribute("data-theme") === "dark";
    var label = dark ? b.getAttribute("data-to-light") : b.getAttribute("data-to-dark");
    b.setAttribute("aria-pressed", String(dark));
    b.setAttribute("aria-label", label);
    b.setAttribute("title", label);
  }
  b.addEventListener("click", function () {
    root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    paint();
  });
  paint();
})();
</script>
</body>
</html>
