<svg class="measure__art" viewBox="0 0 360 272" role="img" aria-labelledby="measure-art-t">
  <title id="measure-art-t">{{m_art_alt}}</title>
  <defs>
    <linearGradient id="m-coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/><stop offset="1" stop-color="#FF4F6D"/>
    </linearGradient>
    <linearGradient id="m-coral-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6F63"/><stop offset="1" stop-color="#E8465F"/>
    </linearGradient>
    <marker id="m-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="m-tip--a" d="M0 1 L9 5 L0 9 z"/></marker>
    <marker id="m-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="m-tip--b" d="M0 1 L9 5 L0 9 z"/></marker>
    <marker id="m-arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="m-tip--c" d="M0 1 L9 5 L0 9 z"/></marker>
  </defs>

  <!-- ===== DE FRENTE ===== -->
  <!-- asa telescópica bajada: solo asoma el agarre -->
  <rect class="m-grip" x="96" y="28" width="38" height="11" rx="5.5"/>
  <rect class="m-post" x="101" y="36" width="5" height="8"/>
  <rect class="m-post" x="124" y="36" width="5" height="8"/>
  <!-- cuerpo rígido con estrías -->
  <rect x="58" y="42" width="114" height="160" rx="18" fill="url(#m-coral)"/>
  <rect class="m-rib" x="78" y="60" width="9" height="124" rx="4.5"/>
  <rect class="m-rib" x="110.5" y="60" width="9" height="124" rx="4.5"/>
  <rect class="m-rib" x="143" y="60" width="9" height="124" rx="4.5"/>
  <!-- ruedas giratorias -->
  <rect class="m-post" x="66" y="200" width="14" height="6" rx="2"/>
  <rect class="m-post" x="150" y="200" width="14" height="6" rx="2"/>
  <circle class="m-wheel" cx="73" cy="211" r="6.5"/>
  <circle class="m-wheel" cx="157" cy="211" r="6.5"/>

  <!-- ===== DE COSTADO ===== -->
  <rect class="m-grip" x="274" y="28" width="16" height="11" rx="5.5"/>
  <rect class="m-post" x="279.5" y="36" width="5" height="8"/>
  <rect x="234" y="42" width="62" height="160" rx="16" fill="url(#m-coral-side)"/>
  <path class="m-seam" d="M265 48 V196"/>
  <!-- asa lateral -->
  <path class="m-handle" d="M252 126 v-7 q0-5 5-5 h16 q5 0 5 5 v7"/>
  <rect class="m-post" x="239" y="200" width="14" height="6" rx="2"/>
  <rect class="m-post" x="277" y="200" width="14" height="6" rx="2"/>
  <circle class="m-wheel" cx="246" cy="211" r="6.5"/>
  <circle class="m-wheel" cx="284" cy="211" r="6.5"/>

  <!-- líneas de referencia -->
  <path class="m-ext" d="M96 28 H24 M66 217.5 H24 M58 206 V244 M172 206 V244 M234 206 V244 M296 206 V244"/>

  <!-- flechas -->
  <path class="m-dim m-dim--a" d="M36 31 V214.5" marker-start="url(#m-arr-a)" marker-end="url(#m-arr-a)"/>
  <path class="m-dim m-dim--b" d="M61 236 H169" marker-start="url(#m-arr-b)" marker-end="url(#m-arr-b)"/>
  <path class="m-dim m-dim--c" d="M237 236 H293" marker-start="url(#m-arr-c)" marker-end="url(#m-arr-c)"/>

  <!-- números -->
  <g class="m-tags">
    <g transform="translate(36 122)"><circle class="m-tag m-tag--a" r="12"/><text y="4.6">1</text></g>
    <g transform="translate(115 236)"><circle class="m-tag m-tag--b" r="12"/><text y="4.6">2</text></g>
    <g transform="translate(265 236)"><circle class="m-tag m-tag--c" r="12"/><text y="4.6">3</text></g>
  </g>

  <!-- rótulos -->
  <text class="m-cap" x="115" y="266">{{m_front}}</text>
  <text class="m-cap" x="265" y="266">{{m_side}}</text>
</svg>
