<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DOC_TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="alternate" hreflang="en" href="{{HREF_EN}}">
<link rel="alternate" hreflang="es" href="{{HREF_ES}}">
<link rel="alternate" hreflang="x-default" href="{{HREF_EN}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
{{STYLE}}
</style>
</head>
<body>

<!-- Página de texto (legales y las que vengan). El contenido vive en
     sitio/legal/<pagina>.<idioma>.html como fragmento; esta plantilla solo
     aporta la cabecera, el pie y el canonical. -->

<div class="shell">

  <header>
    <div class="topbar">
      <p class="wordmark">Willitboard</p>
      <nav class="langnav" aria-label="{{nav_label}}">
        <a href="{{NAV_EN_PATH}}" lang="en" hreflang="en"{{NAV_EN_CUR}}>English</a>
        <a href="{{NAV_ES_PATH}}" lang="es" hreflang="es"{{NAV_ES_CUR}}>Español</a>
      </nav>
    </div>
    <nav class="crumbs" aria-label="{{crumbs_label}}">
      <a href="{{CHECKER_HREF}}">{{crumbs_home}}</a>
      <span aria-hidden="true">/</span>
      <span>{{CRUMB_SELF}}</span>
    </nav>
    <h1>{{H1}}</h1>
    <p class="standfirst">{{STANDFIRST}}</p>
  </header>

  <section class="prose legaldoc">
{{CONTENT}}
  </section>

  <footer>
    <p>{{PAGE_UPDATED}}</p>
{{FOOTER_LINKS}}
  </footer>
</div>

</body>
</html>
